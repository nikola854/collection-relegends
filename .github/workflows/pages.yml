name: Zverejneni webu
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Rozbalit a pripravit web
        run: |
          mkdir site
          unzip -q collection-relegends-web.zip -d site
          rm -rf site/_cards-presmerovani site/NAVOD-SPUSTENI.txt site/.htaccess
          sed -i '3s/G-XXXXXXXXXX/G-C5VTK2V5W3/' site/assets/analytics.js
          grep -q 'RL_GA_ID = "G-C5VTK2V5W3"' site/assets/analytics.js
          echo collection.relegends.cz > site/CNAME
          touch site/.nojekyll
          printf '<!DOCTYPE html><html lang="cs"><head><meta charset="utf-8"><title>reLEGENDS COLLECTION</title><meta name="robots" content="noindex"><meta http-equiv="refresh" content="0; url=/"></head><body><a href="/">reLEGENDS COLLECTION</a></body></html>' > site/404.html
          # obrazky karet ze slozky karty/ (G01..G18, G04-back; webp, jpg nebo png)
          if [ -d karty ]; then
            sudo apt-get install -y -qq webp >/dev/null
            for f in karty/*; do
              [ -f "$f" ] || continue
              name=$(basename "$f")
              code=$(echo "$name" | grep -oE 'G[0-9]{2}' | head -1)
              [ -n "$code" ] || continue
              case "${name,,}" in *zadni*|*back*) code="$code-back" ;; esac
              echo "$name -> $code.webp"
              case "${name,,}" in
                *.webp) cp "$f" "site/img/cards/$code.webp" ;;
                *.jpg|*.jpeg|*.png) cwebp -quiet -q 85 -resize 640 0 "$f" -o "site/img/cards/$code.webp" ;;
              esac
            done
            rm -f site/img/cards/SEM-PATRI-KARTY.txt
          fi
          # rozlozeni pres celou sirku + menu v liste od 1200 px
          cat > site/assets/layout.css <<'CSS'
          .wrap{max-width:1760px;padding-left:max(clamp(16px,4vw,80px),env(safe-area-inset-left,0px));padding-right:max(clamp(16px,4vw,80px),env(safe-area-inset-right,0px))}
          @media (min-width:1200px){.nav-bar{grid-template-columns:auto 1fr auto!important;gap:clamp(14px,1.4vw,32px)}.nav-links{display:flex!important;justify-content:center;gap:clamp(12px,1.4vw,36px)}.menu-btn{display:none!important}.nav-panel{display:none!important}}
          @media (min-width:1200px) and (max-width:1499px){.logo small{display:none}.nav-links{font-size:10px;letter-spacing:.12em}nav .btn{padding:0 14px}}
          CSS
          for h in site/index.html site/en/index.html site/de/index.html site/it/index.html; do
            sed -i 's#</head>#<link rel="stylesheet" href="/assets/layout.css"></head>#' "$h"
            grep -q 'assets/layout.css' "$h"
          done
          # jemna stopa pneumatik pres celou stranku
          cat > site/assets/trail.css <<'CSS'
          /* jemna stopa pneumatik, ktera klickuje celou strankou (vlevo / vpravo) */
          .rl-trail:is(#rl-x,.rl-trail){position:relative;overflow:hidden}
          .rl-trail:is(#rl-x,.rl-trail)>.wrap{position:relative;z-index:1}
          .rl-trail:is(#rl-x,.rl-trail)::before{content:"";position:absolute;top:50%;left:auto;right:auto;width:clamp(300px,34vw,560px);aspect-ratio:4/5;transform:translateY(-50%);background:center/contain no-repeat var(--t1);opacity:.13;pointer-events:none;z-index:0;-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 24%,#000 76%,transparent 100%);mask-image:linear-gradient(to bottom,transparent 0,#000 24%,#000 76%,transparent 100%);clip-path:inset(0 0 0 0);transition:clip-path 2.2s cubic-bezier(.3,.7,.2,1)}
          .rl-trail:is(#rl-x,.rl-trail).rl-b::before{background-image:var(--t2)}
          .rl-trail:is(#rl-x,.rl-trail).rl-r::before{right:-7%}
          .rl-trail:is(#rl-x,.rl-trail).rl-l::before{left:-7%;transform:translateY(-50%) scaleX(-1)}
          html.rl-js .rl-trail:is(#rl-x,.rl-trail):not(.rl-in)::before{clip-path:inset(0 0 100% 0)}
          @media (max-width:820px){
          .rl-trail:is(#rl-x,.rl-trail)::before{width:100vw;opacity:.17}
          .rl-trail:is(#rl-x,.rl-trail).rl-r::before{right:-46vw}
          .rl-trail:is(#rl-x,.rl-trail).rl-l::before{left:-46vw}
          }
          @media (prefers-reduced-motion:reduce){.rl-trail:is(#rl-x,.rl-trail)::before{transition:none}}
          #urovne::before,#setkani::before,#komunita::before{content:none}
          /* otisk pneumatiky pres tabulku u Mystery Packu */
          .stats{position:relative;overflow:hidden;isolation:isolate}
          .stats>div{position:relative;z-index:1}
          .stats::after{content:"";position:absolute;left:62%;top:50%;width:clamp(220px,26vw,380px);aspect-ratio:4/5;transform:translate(-50%,-50%) rotate(-74deg);background:url("/img/892174bc.webp") center/contain no-repeat;opacity:.16;mix-blend-mode:multiply;pointer-events:none;z-index:0}
          @media (max-width:820px){.stats::after{left:58%;width:300px;opacity:.14}}
          CSS
          cat > site/assets/trail.js <<'JS'
          (function () {
            var list = [
              document.getElementById('pribeh')
            ].filter(Boolean);
            list.forEach(function (s, i) {
              s.classList.add('rl-trail', i % 2 ? 'rl-l' : 'rl-r');
              if (i % 2) s.classList.add('rl-b');
            });
            var still = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
            if (still || !('IntersectionObserver' in window)) { list.forEach(function (s) { s.classList.add('rl-in'); }); return; }
            document.documentElement.classList.add('rl-js');
            var io = new IntersectionObserver(function (es) {
              es.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add('rl-in'); io.unobserve(e.target); } });
            }, { rootMargin: '0px 0px -20% 0px' });
            list.forEach(function (s) { io.observe(s); });
          })();
          JS
          for h in site/index.html site/en/index.html site/de/index.html site/it/index.html; do
            sed -i 's#</head>#<link rel="stylesheet" href="/assets/trail.css"></head>#; s#</body>#<script src="/assets/trail.js" defer></script></body>#' "$h"
            grep -q 'assets/trail.js' "$h"
          done
          # deleni sekci rychlostnimi carami (z obrazku nad zapatim)
          python3 -m pip install -q --break-system-packages pillow numpy 2>/dev/null || python3 -m pip install -q pillow numpy
          cat > /tmp/gen_divider.py <<'PY'
          import sys
          from PIL import Image
          import numpy as np
          im=np.array(Image.open(sys.argv[1]).convert('RGBA')).astype(float)
          c=im[30:205].copy(); h=c.shape[0]; y=np.arange(h); pk=128
          env=np.where(y<pk,(y/pk)**0.6,np.clip(1-(y-pk)/(h-pk),0,1)**1.4)
          c[:,:,3]*=env[:,None]*0.55
          x=np.arange(c.shape[1]); c[:,:,3]*=np.clip(0.35+x/c.shape[1],0,1)[None,:]
          c[:,:,:3]=14
          o=Image.fromarray(c.clip(0,255).astype('uint8'),'RGBA')
          o.save(sys.argv[2]+'/divider.webp',quality=85,method=6)
          o.transpose(Image.FLIP_LEFT_RIGHT).save(sys.argv[2]+'/divider-l.webp',quality=85,method=6)
          PY
          python3 /tmp/gen_divider.py site/img/5c33af49.png site/assets
          cat > site/assets/divider.css <<'CSS'
          /* deleni sekci jemnymi rychlostnimi carami misto sede linky */
          #pribeh,#garaz,#garaz+.band,#mystery,#urovne,#setkani,#komunita,#instagram{border-bottom:0;background-image:url("/assets/divider.webp");background-repeat:no-repeat;background-position:center bottom;background-size:100% clamp(30px,5vw,84px)}
          #garaz,#mystery,#setkani,#instagram{background-image:url("/assets/divider-l.webp")}
          #partneri{border-bottom:0}
          #pribeh{background-image:url("/assets/divider-l.webp"),url("/assets/divider.webp");background-position:center top,center bottom}
          @media (max-width:820px){#pribeh,#garaz,#garaz+.band,#mystery,#urovne,#setkani,#komunita,#instagram{background-size:180% 34px}}
          CSS
          for h in site/index.html site/en/index.html site/de/index.html site/it/index.html; do
            sed -i 's#</head>#<link rel="stylesheet" href="/assets/divider.css"></head>#' "$h"
            grep -q 'assets/divider.css' "$h"
          done
          # spodni cerna cast: novy nadpis a vse na stred
          cat > site/assets/final.css <<'CSS'
          .finale-band .finale{text-align:center;justify-items:center}
          .finale-band .finale p{text-align:center;margin-inline:auto}
          .finale-band .finale h2{font-size:clamp(38px,6.2vw,88px)}
          .finale-band .finale .finale-tag{font-family:var(--mono);font-size:12px;letter-spacing:.32em;color:var(--muted);margin-top:-14px}
          .finale-band .finale .finale-tag b{color:var(--red);font-weight:400;padding-inline:.5em}
          CSS
          for h in site/index.html site/en/index.html site/de/index.html site/it/index.html; do
            sed -i -e 's#<h2>Every car has a <em class="red">card.</em></h2>#<h2>Collect what you love. <em class="red">Meet at the garage.</em></h2><div class="finale-tag">COLLECT<b>|</b>TRADE<b>|</b>PLAY</div>#' -e 's#</head>#<link rel="stylesheet" href="/assets/final.css"></head>#' "$h"
            grep -q 'finale-tag' "$h"
          done
          # opravy: mrizka 18 GRID, poradi u 02 na telefonu, pretaceni partneru
          cat > site/assets/fix.css <<'CSS'
          /* 06: 18 GRID karet jako uhledna mrizka, bez prekryvani */
          #setkani .slots{row-gap:10px;column-gap:8px}
          #setkani .slots span.card{--cw:100%;width:auto;height:auto;aspect-ratio:63/88;border:0;border-radius:4px;background:#111;padding:0;overflow:hidden;transform:none;animation:none;box-shadow:0 6px 14px rgba(17,17,17,.22)}
          #setkani .slots span.card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:none}
          #setkani .slots span.card .streak{display:none}
          @media (hover:hover){#setkani .slots span.card{transition:transform .25s}#setkani .slots span.card:hover{transform:translateY(-4px) scale(1.04);z-index:2}}
          /* 02: na telefonu nejdriv nazev auta, pod nim karty */
          @media (max-width:820px){
          #garaz{display:flex;flex-direction:column}
          #garaz>.s-head{order:1}#garaz>.s-foot{order:2;margin-top:20px;gap:12px}#garaz>.deck{order:3}
          #garaz .deck{--dcw:150px;height:calc(var(--dcw) * 88 / 63 + 76px);margin-top:4px}
          #garaz .deck .card{top:14px}
          #garaz .s-now{display:grid;grid-template-columns:auto 1fr auto;align-items:end;gap:6px 16px}
          #garaz .s-now .code{font-size:38px}
          #garaz .s-now .s-arrows{grid-column:3;grid-row:1}
          #garaz .s-now .s-arrows button{width:44px;height:44px}
          #garaz .s-meta{min-width:0}
          }
          /* 09: partneri jdou pretacet mysi i prstem */
          .marquee.rl-drag{cursor:grab;touch-action:pan-y;user-select:none;-webkit-user-select:none}
          .marquee.rl-drag.is-drag{cursor:grabbing}
          .marquee.rl-drag .marquee-track{animation:none!important;will-change:transform}
          .marquee.rl-drag img{-webkit-user-drag:none;pointer-events:none}
          @media (prefers-reduced-motion:reduce){.marquee.rl-drag{-webkit-mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent);mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent)}.marquee.rl-drag .marquee-track{width:max-content;flex-wrap:nowrap;padding-inline:0}.marquee.rl-drag .marquee-track [aria-hidden="true"]{display:grid}}
          CSS
          cat > site/assets/partners.js <<'JS'
          /* partneri: plynule jedou sami, jdou chytit a rychle pretocit mysi i prstem */
          (function () {
            var m = document.getElementById('marquee'), t = document.getElementById('marqueeTrack');
            if (!m || !t) return;
            var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
            m.classList.add('rl-drag');
            var x = 0, v = 0, auto = reduce ? 0 : 0.45, down = false, sx = 0, x0 = 0, lx = 0, lt = 0, moved = 0, hover = false;
            function half() { return t.scrollWidth / 2; }
            function apply() { var w = half(); if (w > 0) x = ((x % w) + w) % w; t.style.transform = 'translate3d(' + (-x) + 'px,0,0)'; }
            function loop() {
              if (!down) {
                if (Math.abs(v) > 0.05) { x += v; v *= 0.94; }
                else if (!hover) x += auto;
                apply();
              }
              requestAnimationFrame(loop);
            }
            m.addEventListener('pointerdown', function (e) {
              if (e.button !== undefined && e.button !== 0) return;
              down = true; moved = 0; sx = e.clientX; x0 = x; lx = e.clientX; lt = performance.now(); v = 0;
              m.classList.add('is-drag');
            });
            window.addEventListener('pointermove', function (e) {
              if (!down) return;
              var dx = e.clientX - sx; moved = Math.max(moved, Math.abs(dx));
              x = x0 - dx;
              var now = performance.now(), dt = now - lt;
              if (dt > 0) v = -(e.clientX - lx) / dt * 16;
              lx = e.clientX; lt = now; apply();
            });
            function end() { if (!down) return; down = false; m.classList.remove('is-drag'); if (performance.now() - lt > 90) v = 0; v = Math.max(-60, Math.min(60, v)); }
            window.addEventListener('pointerup', end); window.addEventListener('pointercancel', end);
            m.addEventListener('click', function (e) { if (moved > 6) { e.preventDefault(); e.stopPropagation(); } }, true);
            m.addEventListener('dragstart', function (e) { e.preventDefault(); });
            m.addEventListener('wheel', function (e) {
              var d = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : 0;
              if (d) { e.preventDefault(); v += d * 0.06; }
            }, { passive: false });
            m.addEventListener('mouseenter', function () { hover = true; });
            m.addEventListener('mouseleave', function () { hover = false; });
            requestAnimationFrame(loop);
          })();
          JS
          for h in site/index.html site/en/index.html site/de/index.html site/it/index.html; do
            sed -i 's#</head>#<link rel="stylesheet" href="/assets/fix.css"></head>#; s#</body>#<script src="/assets/partners.js" defer></script></body>#' "$h"
            grep -q 'assets/partners.js' "$h"
          done
          # upravy textu
          for h in site/index.html site/en/index.html site/de/index.html site/it/index.html; do
            sed -i -e "s|Mystery Packy a Skyline, ze kterého je karta.|Mystery Packy a Skyline, který je součástí první série.|" -e "s|Mystery Packs and the Skyline the card was made from.|Mystery Packs and the Skyline, part of the first series.|" -e "s|Mystery Packs und der Skyline, aus dem die Karte entstand.|Mystery Packs und der Skyline, Teil der ersten Serie.|" -e "s|I Mystery Pack e la Skyline da cui è nata la carta.|I Mystery Pack e la Skyline, parte della prima serie.|" "$h"
            grep -q "součástí první série" "$h"
          done
          # verze souboru proti starym kopiim v prohlizeci
          sed -i "s#/assets/\(layout\|trail\|divider\|final\|fix\|partners\)\.\(css\|js\)\"#/assets/\1.\2?v=${GITHUB_SHA::8}\"#g" site/index.html site/en/index.html site/de/index.html site/it/index.html
          find site -type f | sort
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
