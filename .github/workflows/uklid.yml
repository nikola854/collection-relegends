name: Uklid repozitare
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  uklid:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Smazat vse krome ZIPu webu a zverejnovaciho skriptu
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git ls-files | grep -v -x -e collection-relegends-web.zip -e .github/workflows/pages.yml | xargs -r -d '\n' git rm -q --
          git status --short
          git commit -m "Uklid: odstraneni zbytecnych souboru"
          git push
